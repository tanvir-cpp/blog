<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post — Blog</title>
  <meta name="description" content="A quiet place for writing.">
  <link rel="stylesheet" href="assets/style.css">
  <script>
    (function() {
      var saved = localStorage.getItem('blog_theme');
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = saved || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <div class="site-header-row">
        <a class="wordmark" href="./">Blog</a>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">Dark</button>
      </div>
    </header>

    <main>
      <article class="post" id="post-article" hidden>
        <span class="meta" id="post-date"></span>
        <h1 class="post-title" id="post-title"></h1>
        <div class="prose" id="post-body"></div>
      </article>

      <p class="status" id="status">Loading…</p>

      <a class="back-link" href="./">&larr; All posts</a>
    </main>

    <footer class="site-footer">
      <span id="footer-year"></span>
      <a href="https://telegram.org" rel="me">Telegram</a>
    </footer>
  </div>

  <script src="assets/js/marked.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();
    renderPost();
  </script>
</body>
</html>
