<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Post — Blog</title>
  <meta name="description" content="A quiet place for writing.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="page">
    <header class="site">
      <a class="wordmark" href="./">Blog</a>
    </header>

    <main>
      <article class="post" id="post-article" hidden>
        <span class="meta" id="post-date"></span>
        <h1 class="post-title" id="post-title"></h1>
        <div class="prose" id="post-body" hidden></div>
      </article>
      <p class="status" id="status">Loading…</p>
      <a class="back-link" href="./">&larr; All posts</a>
    </main>

    <footer class="site">
      <span id="footer-year"></span>
    </footer>
  </div>

  <script src="assets/js/marked.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();
    renderPost();
  </script>
</body>
</html>
