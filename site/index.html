<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog</title>
  <meta name="description" content="A quiet place for writing.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="page">
    <header class="site">
      <a class="wordmark" href="./">Blog</a>
      <h1>Notes, essays, and occasional fragments.</h1>
    </header>

    <main>
      <ul class="post-list" id="post-list" hidden></ul>
      <p class="status" id="status">Loading…</p>
    </main>

    <footer class="site">
      <span id="footer-year"></span>
      <a href="https://telegram.org" rel="me">Telegram</a>
    </footer>
  </div>

  <script src="assets/js/marked.min.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.getElementById('footer-year').textContent = new Date().getFullYear();
    renderIndex();
  </script>
</body>
</html>
